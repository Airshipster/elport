name: Portfolio Yolda visual QA
on:
  push:
    branches: [portfolio-yolda-qa-20261127]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser driver
        run: npm install --prefix "$RUNNER_TEMP/portfolio-qa" playwright-core@1.56.1 --no-audit --no-fund
      - name: Validate candidate in browser
        env:
          NODE_PATH: ${{ runner.temp }}/portfolio-qa/node_modules
        run: node .github/qa/candidate-test.cjs
      - name: Validate review in isolated storage
        env:
          NODE_PATH: ${{ runner.temp }}/portfolio-qa/node_modules
          CV_REVIEW_QA_PASSWORD: ${{ secrets.CV_REVIEW_QA_PASSWORD_20261126 }}
        run: node .github/qa/review-preservation.cjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-yolda-qa
          path: qa-output/
          if-no-files-found: ignore

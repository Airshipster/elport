<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Согласование текстов · Elman Ahmadbayov</title>
  <link rel="stylesheet" href="../review/review-login.css">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-clear-20261127.png?v=1"></head>
<body>
  <main class="login-card">
    <a class="brand" href="../">Elman Ahmadbayov</a>
    <nav class="languages" aria-label="Language"><button type="button" data-lang="az">AZ</button><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></nav>
    <p class="eyebrow" data-copy="eyebrow">Müvəqqəti giriş</p>
    <h1 data-copy="title">Mətnlərin razılaşdırılması</h1>
    <p class="intro" data-copy="intro">Saytın mətnlərinə düzəliş təklif etmək və şərh yazmaq üçün daxil olun.</p>
    <form id="login-form">
      <label><span data-copy="login">İstifadəçi adı</span><input name="login" autocomplete="username" required maxlength="80"></label>
      <label><span data-copy="password">Şifrə</span><input name="password" type="password" autocomplete="current-password" required maxlength="128"></label>
      <label><span data-copy="name">Adınız</span><input name="name" autocomplete="name" required maxlength="80"></label>
      <p id="login-error" role="alert" aria-live="polite"></p>
      <button type="submit" data-copy="submit">Daxil ol</button>
    </form>
    <p class="footnote" data-copy="footnote">Adınız düzəliş və şərhlərinizin yanında görünəcək.</p>
  </main>
  <script src="../review/login.js" defer></script>
</body>
</html>
